<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:1080px;height:1080px;
  background:#888;
  font-family:'Outfit',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.pancarte{
  background:#0D2D6E;
  border-radius:20px;
  padding:48px 64px 44px;
  width:960px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  position:relative;
  overflow:hidden;
}
.pancarte::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:5px;
  background:#4BAEE8;
}
.line1{
  color:#fff;font-size:42px;font-weight:800;
  text-transform:uppercase;letter-spacing:0.5px;
  line-height:1.15;margin-bottom:18px;
}
.divider{
  width:100%;height:1px;
  background:rgba(255,255,255,0.2);
  margin:18px 0;
}
.line2{
  color:rgba(255,255,255,0.85);
  font-size:26px;font-weight:500;
  letter-spacing:0.3px;margin-bottom:16px;
}
.line3{
  color:#4BAEE8;font-size:44px;
  font-weight:700;letter-spacing:2px;
}
</style>
</head>
<body>
<div class="pancarte">
  <div class="line1">Certains métiers ne se remplacent pas.</div>
  <div class="divider"></div>
  <div class="line2">Le Vitrier &nbsp;·&nbsp; De Cannes à Monaco</div>
  <div class="line3">06 77 30 30 65</div>
</div>
</body>
</html>
